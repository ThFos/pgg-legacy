<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Leaderboard - PGG Legacy</title>
    <link rel="icon" type="image/png" href="media/favicon.png">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.bunny.net/css?family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
      .leaderboard-container {
        max-width: 900px;
        margin: 120px auto 60px;
        padding: 20px;
      }
      .leaderboard-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 10px;
      }
      .leaderboard-table th {
        color: #ffcc00;
        text-align: left;
        padding: 12px 20px;
        font-size: 1.1rem;
        text-transform: uppercase;
      }
      .leaderboard-row {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      .leaderboard-row:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.1);
      }
      .leaderboard-row td {
        padding: 15px 20px;
        color: #fff;
      }
      .leaderboard-row td:first-child {
        border-top-left-radius: 12px;
        border-bottom-left-radius: 12px;
        font-weight: bold;
        font-size: 1.2rem;
      }
      .leaderboard-row td:last-child {
        border-top-right-radius: 12px;
        border-bottom-right-radius: 12px;
      }
      .player-cell {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .player-avatar {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }
      .rank-1 { color: #ffd700; }
      .rank-2 { color: #c0c0c0; }
      .rank-3 { color: #cd7f32; }
    </style>
  </head>
  <body>
    <div class="custom-cursor" id="cursor"></div>
    <div class="cursor-glow" id="cursorGlow"></div>

    <nav class="desktop_navbar">
      <a href="index.html"><img class="desktop_navbar_logo_img" src="media/logo_small.svg" alt="logo"></a>
      <a href="index.html#rules" class="desktop_navbar_link">Rules</a>
      <a href="index.html#discord" class="desktop_navbar_link">Community</a>
      <a href="leaderboard.html" class="desktop_navbar_link" style="color: #ffcc00; font-weight: bold;">Leaderboard</a>
      <a href="police-apps.html" class="desktop_navbar_link" style="color: #ffcc00; font-weight: bold;">Police Applications</a>
      <div class="desktop_navbar_link2_div">
          <a href="index.html#join" class="desktop_navbar_link2">Join Us!</a>
      </div>
    </nav>

    <div class="mobile_navbar">
      <a href="index.html" class="mobile_navbar_logo_img_a">
        <img class="mobile_navbar_logo_img" src="media/logo_small.svg" alt="logo">
      </a>
      <div class="icon" onclick="toggleMobileMenu()">
          <i class="fa fa-bars" id="menuIcon"></i>
      </div>
      <div id="mobile_navbar_links">
          <a class="mobile_navbar_link" href="index.html#rules">Rules</a>
          <a class="mobile_navbar_link" href="index.html#discord">Community</a>
          <a class="mobile_navbar_link" href="leaderboard.html" style="color: #ffcc00; font-weight: bold;">Leaderboard</a>
          <a class="mobile_navbar_link" href="police-apps.html" style="color: #ffcc00; font-weight: bold;">Police Apps</a>
          <a class="mobile_navbar_link" href="index.html#join">Join Us</a>
      </div>
    </div>

    <div class="leaderboard-container" data-aos="fade-up">
      <h2 class="headline">Top Players Leaderboard</h2>
      
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th>Score / Playtime</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <!-- Τα δεδομένα θα φορτωθούν εδώ -->
        </tbody>
      </table>
    </div>

    <footer class="copyright_div">
      <a href="#" class="copyright">© 2026 PGG Legacy - All rights reserved.</a>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({ duration: 800, once: true });

      function toggleMobileMenu() {
        const menu = document.getElementById("mobile_navbar_links");
        const icon = document.getElementById("menuIcon");
        if (menu.style.display === "flex") {
            menu.style.display = "none";
            icon.className = "fa fa-bars";
        } else {
            menu.style.display = "flex";
            icon.className = "fa fa-times";
        }
      }

      // Παράδειγμα δεδομένων Leaderboard (Μπορείς να τα προσαρμόσεις)
      const topPlayers = [
        { name: "MPAMIASDL", score: "1,250 hrs" },
        { name: "ThFos", score: "1,100 hrs" },
        { name: "kon212121", score: "980 hrs" },
        { name: "Player4", score: "750 hrs" },
        { name: "Player5", score: "600 hrs" }
      ];

      const tbody = document.getElementById('leaderboard-body');
      
      topPlayers.forEach((player, index) => {
        const rank = index + 1;
        let rankClass = '';
        if (rank === 1) rankClass = 'rank-1';
        else if (rank === 2) rankClass = 'rank-2';
        else if (rank === 3) rankClass = 'rank-3';

        // Σύνδεση με το Render API για τα skins
        const avatarUrl = `https://pgg-legacy.onrender.com/index.php?name=${encodeURIComponent(player.name)}`;

        const row = document.createElement('tr');
        row.className = 'leaderboard-row';
        row.innerHTML = `
          <td class="${rankClass}">#${rank}</td>
          <td>
            <div class="player-cell">
              <img class="player-avatar" src="${avatarUrl}" alt="${player.name}" onerror="this.src='https://mc-heads.net/avatar/${player.name}/64'">
              <span>${player.name}</span>
            </div>
          </td>
          <td>${player.score}</td>
        `;
        tbody.appendChild(row);
      });
    </script>
  </body>
</html>
