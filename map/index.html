    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
        }
        body.menu-open {
            overflow: auto;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .map-info-bar {
            position: fixed;
            top: 5.2rem;
            left: 0;
            width: 100%;
            background: rgba(18, 17, 23, 0.92);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 50;
            border-bottom: 1px solid rgba(107, 45, 216, 0.3);
        }
        .map-info-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
            white-space: nowrap;
        }
        .map-info-desc {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .map-container {
            width: 100%;
            height: calc(100vh - 5.2rem - 50px);
            margin-top: calc(5.2rem + 50px);
            border: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media only screen and (max-width: 768px) {
            .map-info-bar {
                top: 60px;
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
                padding: 6px 15px;
            }
            .map-info-desc {
                display: none;
            }
            .map-container {
                height: calc(100vh - 60px - 45px);
                margin-top: calc(60px + 45px);
            }
        }
    </style>
  </head>
  <body>
    <div class="custom-cursor" id="cursor" aria-hidden="true"></div>
    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
    <nav class="desktop_navbar" aria-label="Desktop Navigation">
      <a href="/">
        <img class="desktop_navbar_logo_img" src="/media/logo_small.svg" alt="PGG Legacy - Ελληνικός Minecraft RP Server" width="152" height="40">
      </a>
      <a href="/#rules" class="desktop_navbar_link">Rules</a>
      <a href="/#discord" class="desktop_navbar_link">Community</a>
      <a href="/#about" class="desktop_navbar_link">About Us</a>
      <a href="/map" class="desktop_navbar_link nav-highlight-purple">Server Map</a>
      <a href="/leaderboard" class="desktop_navbar_link nav-highlight-blue">Leaderboard</a>
      <a href="/police" class="desktop_navbar_link nav-highlight-gold">Police Applications</a>
      <div class="desktop_navbar_link2_div">
          <a href="/#join" class="desktop_navbar_link2">Join Us!</a>
      </div>
    </nav>
    <nav class="mobile_navbar" aria-label="Mobile Navigation">
      <a href="/" class="mobile_navbar_logo_img_a">
        <img class="mobile_navbar_logo_img" src="/media/logo_small.svg" alt="PGG Legacy - Ελληνικός Minecraft RP Server" width="152" height="40">
      </a>
      <button class="icon" aria-expanded="false" aria-controls="mobile_navbar_links" aria-label="Άνοιγμα μενού">
        <svg id="menuIcon" class="menu-icon" viewBox="0 0 24 24" width="24" height="24" fill="white">
          <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
        </svg>
      </button>
      <div id="mobile_navbar_links">
          <a class="mobile_navbar_link" href="/#rules">Rules</a>
          <a class="mobile_navbar_link" href="/#discord">Community</a>
          <a class="mobile_navbar_link" href="/#about">About Us</a>
          <a class="mobile_navbar_link nav-highlight-purple" href="/map">Server Map</a>
          <a class="mobile_navbar_link nav-highlight-blue" href="/leaderboard">Leaderboard</a>
          <a class="mobile_navbar_link nav-highlight-gold" href="/police">Police Apps</a>
          <a class="mobile_navbar_link" href="/#join">Join Us</a>
      </div>
    </nav>
    <main>
      <div class="map-info-bar">
        <h1 class="map-info-title">
            🗺️ PGG Legacy – Live Server Map
        </h1>
        <span class="map-info-desc">
            Εξερευνήστε τον κόσμο του PGG Legacy 
            Minecraft Server σε πραγματικό χρόνο
        </span>
      </div>
      <div class="map-container">
            <iframe 
                src="https://map.pgglegacy.gr/" 
                title="PGG Legacy Live Minecraft Server Map" 
                allowfullscreen 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
                <p>
                    <a href="https://map.pgglegacy.gr/" 
                        target="_blank" rel="noopener noreferrer"> 
                        Δείτε τον χάρτη εδώ 
                    </a>
                </p>
            </iframe>
      </div>
    </main>
    <script defer>
      document.addEventListener("DOMContentLoaded", function() {
        // Mobile Menu Setup
        const mobileMenuIcon = document.querySelector('.icon');
        if (mobileMenuIcon) {
          mobileMenuIcon.addEventListener('click', toggleMobileMenu);
        }
        document.querySelectorAll('#mobile_navbar_links a').forEach(link => {
            link.addEventListener('click', () => {
                const menu = document.getElementById("mobile_navbar_links");
                if(menu.style.display === "flex") toggleMobileMenu();
            });
        });
        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
          const cursor = document.getElementById('cursor');
          const glow = document.getElementById('cursorGlow');
          document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
          });
        }
      });
      function toggleMobileMenu() {
        const menu = document.getElementById("mobile_navbar_links");
        const btn = document.querySelector('.icon');
        const iconSvg = document.getElementById("menuIcon");
        const isOpen = menu.style.display === "flex";
        
        menu.style.display = isOpen ? "none" : "flex";
        btn.setAttribute('aria-expanded', !isOpen);
        document.body.classList.toggle('menu-open', !isOpen);
        
        iconSvg.innerHTML = isOpen
          ? '<path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>'
          : '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';
      }
    </script>
