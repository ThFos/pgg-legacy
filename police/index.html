  <!-- Critical inline styles (cookie banner + base) -->
  <style>
    :root {
      --nice-padding: 6rem;
      --roundness: 0.75rem;
      --accent1: #6b2dd8;
      --accent2: #521eb8;
      --accent2-transp: rgba(82, 30, 184, 0.33);
      --bg1: #1a1921;
      --bg2: #121117;
      --text-muted: rgba(255, 255, 255, 0.7);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --transition-std: 0.3s ease;
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body {
      width: 100%;
      overflow-x: hidden;
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg1);
      color: #fff;
    }
    body.menu-open { overflow: hidden; }
    img { -webkit-user-drag: none; max-width: 100%; }
    ul { list-style: none; }
    :focus-visible {
      outline: 2px solid var(--accent1);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ── AOS Initial State ── */
    [data-aos] { opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease; }
    [data-aos="fade-up"] { transform: translateY(28px); }
    [data-aos="zoom-in"] { transform: scale(0.92); }
    [data-aos].aos-animate { opacity: 1; transform: translateY(0) scale(1); }

    /* ── Navbar Critical ── */
    .desktop_navbar {
      position: fixed; inset: 0 0 auto 0;
      display: flex; height: 5.2rem;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 100; gap: 0.2rem;
    }
    .desktop_navbar_logo_img { width: 9.5rem; height: auto; padding: 0 1.5rem 0 2rem; }
    .desktop_navbar_link {
      font-size: 1.05rem; padding: 0.8rem 1rem;
      text-decoration: none; color: #fff; white-space: nowrap;
    }
    .desktop_navbar_link2_div {
      font-size: 1.05rem; padding: 0.5rem 1rem;
      margin-left: auto; margin-right: 2rem; font-weight: 700;
      border: 1px solid var(--accent1); border-radius: var(--roundness);
      white-space: nowrap;
    }
    .desktop_navbar_link2 { color: #fff; text-decoration: none; }
    .nav-highlight-blue { color: #5865F2 !important; font-weight: 700; }
    .nav-highlight-gold { color: #ffcc00 !important; font-weight: 700; }
    .mobile_navbar { display: none; }

    /* ── Cookie Banner Critical ── */
    #cookie-banner {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 99998;
      background: rgba(18, 17, 23, 0.97);
      border-top: 1px solid rgba(107, 45, 216, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-family: 'Space Grotesk', sans-serif;
      box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
      transform: translateY(100%);
      transition: transform 0.4s ease;
    }
    #cookie-banner.cookie-visible { transform: translateY(0); }
    .cookie-text {
      flex: 1; min-width: 200px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
    }
    .cookie-text strong { color: #fff; font-weight: 700; }
    .cookie-text a {
      color: #a855f7;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color 0.2s;
    }
    .cookie-text a:hover { color: #c084fc; }
    .cookie-buttons {
      display: flex; gap: 0.75rem;
      flex-shrink: 0; flex-wrap: wrap;
    }
    .cookie-btn-accept {
      padding: 0.6rem 1.4rem;
      background: #6b2dd8; color: #fff;
      border: none; border-radius: 0.6rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem; font-weight: 700;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 12px rgba(107, 45, 216, 0.4);
      white-space: nowrap;
    }
    .cookie-btn-accept:hover,
    .cookie-btn-accept:focus-visible {
      background: #7c3aed;
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(107, 45, 216, 0.55);
    }
    .cookie-btn-decline {
      padding: 0.6rem 1.2rem;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 0.6rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      white-space: nowrap;
    }
    .cookie-btn-decline:hover,
    .cookie-btn-decline:focus-visible {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.35);
    }

    /* ── Footer ── */
    .copyright_div {
      width: 100%; display: flex; justify-content: center;
      padding: 1.5rem 1rem; background: #000; text-align: center;
    }
    .copyright { color: var(--text-muted); font-size: 0.9rem; }
    .copyright a { color: var(--text-muted); text-decoration: underline; transition: color 0.2s ease; }
    .copyright a:hover { color: #fff; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .desktop_navbar { display: none; }
      .mobile_navbar {
        display: flex; position: fixed; inset: 0 0 auto 0;
        height: 60px; align-items: center; justify-content: space-between;
        padding: 0 1rem; background: rgba(18, 17, 23, 0.9);
        backdrop-filter: blur(15px);
        border-bottom: 1px solid var(--border-subtle);
        z-index: 100;
      }
      [data-aos] { opacity: 1 !important; transform: none !important; }
    }
    @media (max-width: 600px) {
      #cookie-banner {
        padding: 1rem 1.2rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .cookie-buttons { width: 100%; justify-content: flex-start; }
      .cookie-btn-accept, .cookie-btn-decline { flex: 1; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      #cookie-banner { transition: none; }
    }
  </style>

<body>
  <div class="custom-cursor" id="cursor" aria-hidden="true"></div>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <!-- Desktop Navbar -->
  <nav class="desktop_navbar" aria-label="Κύριο μενού">
    <a href="/" aria-label="PGG Legacy - Αρχική">
      <img class="desktop_navbar_logo_img" src="../media/logo_small.svg"
           alt="PGG Legacy Logo" width="152" height="40" fetchpriority="high">
    </a>
    <a href="/#rules"      class="desktop_navbar_link">Rules</a>
    <a href="/#discord"    class="desktop_navbar_link">Community</a>
    <a href="/#about"      class="desktop_navbar_link">About Us</a>
    <a href="/map"         class="desktop_navbar_link">Server Map</a>
    <a href="/leaderboard" class="desktop_navbar_link nav-highlight-blue">Leaderboard</a>
    <a href="/police"      class="desktop_navbar_link nav-highlight-gold" aria-current="page">Police Applications</a>
    <div class="desktop_navbar_link2_div">
      <a href="/#join" class="desktop_navbar_link2">Join Us!</a>
    </div>
  </nav>

  <!-- Mobile Navbar -->
  <nav class="mobile_navbar" aria-label="Κινητό μενού">
    <a href="/" class="mobile_navbar_logo_img_a" aria-label="PGG Legacy - Αρχική">
      <img class="mobile_navbar_logo_img" src="../media/logo_small.svg"
           alt="PGG Legacy Logo" width="152" height="40">
    </a>
    <button class="icon" aria-expanded="false"
            aria-controls="mobile_navbar_links"
            aria-label="Άνοιγμα μενού πλοήγησης">
      <svg id="menuIcon" viewBox="0 0 24 24" width="24" height="24"
           fill="white" aria-hidden="true" focusable="false">
        <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
      </svg>
    </button>
    <div id="mobile_navbar_links" role="menu">
      <a class="mobile_navbar_link"                     href="/#rules"      role="menuitem">Rules</a>
      <a class="mobile_navbar_link"                     href="/#discord"    role="menuitem">Community</a>
      <a class="mobile_navbar_link"                     href="/#about"      role="menuitem">About Us</a>
      <a class="mobile_navbar_link"                     href="/map"         role="menuitem">Server Map</a>
      <a class="mobile_navbar_link nav-highlight-blue" href="/leaderboard" role="menuitem">Leaderboard</a>
      <a class="mobile_navbar_link nav-highlight-gold" href="/police"      role="menuitem" aria-current="page">Police Apps</a>
      <a class="mobile_navbar_link"                     href="/#join"       role="menuitem">Join Us</a>
    </div>

  <main class="mainflex police-main">
    <section class="main2 police-section" aria-labelledby="police-title">
      <h2 id="police-title" class="headline" data-aos="fade-up">
        Κατάταξη στην Αστυνομία
      </h2>
      <p class="police-intro" data-aos="fade-up" data-aos-delay="100">
        Συμπληρώστε την παρακάτω φόρμα για να εξεταστεί η αίτησή σας από το Staff.
      </p>

      <div class="main2_features_div police-features-div">
        <div class="main2_feature police-form-wrapper" data-aos="zoom-in" data-aos-delay="200">

          <noscript>
            <p style="color:#fff;text-align:center;padding:1rem">
              Παρακαλώ ενεργοποιήστε JavaScript για να υποβάλετε αίτηση.
            </p>
          </noscript>

          <form action="https://api.web3forms.com/submit" method="POST"
                class="police-form" novalidate>

            <input type="hidden" name="access_key" value="d8fdfcc5-2890-4965-8b66-8d859e92fd29">
            <input type="hidden" name="redirect"   value="https://pgglegacy.gr/">
            <input type="hidden" name="subject"    value="Νέα Αίτηση Αστυνομίας - PGG Legacy">
            <input type="checkbox" name="botcheck" aria-hidden="true"
                   tabindex="-1" autocomplete="off" style="display:none">

            <div class="form-group">
              <label for="discord_tag">Discord Username <span aria-hidden="true">*</span></label>
              <input type="text" id="discord_tag" name="Discord Tag"
                     placeholder="π.χ. mpamiasdl" autocomplete="username"
                     required minlength="2" maxlength="32">
            </div>

            <div class="form-group">
              <label for="ign">In-Game Name (Minecraft) <span aria-hidden="true">*</span></label>
              <input type="text" id="ign" name="In-Game Name"
                     placeholder="π.χ. ThFos" autocomplete="nickname"
                     required minlength="3" maxlength="16" pattern="[a-zA-Z0-9_]+">
            </div>

            <div class="form-group">
              <label for="age">Ηλικία (OOC) <span aria-hidden="true">*</span></label>
              <input type="number" id="age" name="Age"
                     placeholder="π.χ. 18" min="12" max="99" required>
            </div>

            <div class="form-group">
              <label for="hours">Διαθέσιμες ώρες / εβδομάδα <span aria-hidden="true">*</span></label>
              <input type="text" id="hours" name="Available Hours"
                     placeholder="π.χ. 10-15 ώρες" required maxlength="30">
            </div>

            <div class="form-group">
              <label for="experience">
                Προηγούμενη εμπειρία ως Αστυνομικός σε RP;
                <span aria-hidden="true">*</span>
              </label>
              <textarea id="experience" name="Experience" rows="4"
                        minlength="30" maxlength="1000"
                        placeholder="Περίγραψε την εμπειρία σου (τουλάχιστον 30 χαρακτήρες)..."
                        required></textarea>
            </div>

            <div class="form-group">
              <label for="reason">
                Γιατί θέλεις να μπεις στο σώμα της Αστυνομίας;
                <span aria-hidden="true">*</span>
              </label>
              <textarea id="reason" name="Reason for Joining" rows="5"
                        minlength="50" maxlength="2000"
                        placeholder="Ανάλυσε τους λόγους (τουλάχιστον 50 χαρακτήρες)..."
                        required></textarea>
            </div>

            <button type="submit" class="police-submit-btn">Υποβολή Αίτησης</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="copyright_div">
    <p class="copyright">
      &copy; <span id="copyright-year"></span> PGG Legacy — All rights reserved. |
      <a href="/privacy">Privacy Policy</a>
    </p>
  </footer>
