    <!-- MAIN CONTENT -->
    <main class="mainflex police-main">
      <section class="main2 police-section">
        <h2 class="headline" data-aos="fade-up">Κατάταξη στην Αστυνομία</h2>
        <p class="main1_actcent police-intro" data-aos="fade-up" data-aos-delay="100">
          Συμπληρώστε την παρακάτω φόρμα για να εξεταστεί η αίτησή σας από το Staff.
        </p>
        
        <div class="main2_features_div police-features-div">
          <div class="main2_feature police-form-wrapper" data-aos="zoom-in" data-aos-delay="200">
            
            <!-- NOSCRIPT για χρήστες χωρίς JavaScript -->
            <noscript>
              <p style="color: white; text-align: center; margin-bottom: 20px;">
                Παρακαλώ ενεργοποιήστε JavaScript για να υποβάλετε αίτηση.
              </p>
            </noscript>

            <form action="https://api.web3forms.com/submit" method="POST" class="police-form">
              <input type="hidden" name="access_key" value="d8fdfcc5-2890-4965-8b66-8d859e92fd29">
              <input type="hidden" name="redirect" value="https://pgglegacy.gr/">

              <!-- Web3Forms Honeypot Anti-Spam -->
              <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

              <div class="form-group">
                <label for="discord_tag">Discord Username</label>
                <input type="text" id="discord_tag" name="Discord Tag" placeholder="π.χ. mpamiasdl" required>
              </div>

              <div class="form-group">
                <label for="ign">In-Game Name (Minecraft Name)</label>
                <input type="text" id="ign" name="In-Game Name" placeholder="π.χ. ThFos" required>
              </div>

              <div class="form-group">
                <label for="age">Ηλικία (OOC)</label>
                <input type="number" id="age" name="Age" min="12" max="99" placeholder="π.χ. 18" required>
              </div>

              <div class="form-group">
                <label for="hours">Πόσες ώρες μπορείς να διαθέσεις την εβδομάδα</label>
                <input type="text" id="hours" name="Available Hours" placeholder="π.χ. 10-15 ώρες" required>
              </div>

              <div class="form-group">
                <label for="experience">Έχεις προηγούμενη εμπειρία ως Αστυνομικός σε RP;</label>
                <textarea id="experience" name="Experience" rows="4" minlength="30" placeholder="Περίγραψε την εμπειρία σου σε άλλους servers (τουλάχιστον 30 χαρακτήρες)..." required></textarea>
              </div>

              <div class="form-group">
                <label for="reason">Γιατί θέλεις να μπεις στο σώμα της Αστυνομίας;</label>
                <textarea id="reason" name="Reason for Joining" rows="4" minlength="50" placeholder="Ανάλυσε τους λόγους (τουλάχιστον 50 χαρακτήρες)..." required></textarea>
              </div>

              <div>
                <button type="submit" class="police-submit-btn">
                  Υποβολή Αίτησης
                </button>
              </div>
            </form>
          </div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script defer>
      window.addEventListener('load', function() {
        if(typeof AOS !== 'undefined') {
          AOS.init({ duration: 800, once: true, disable: window.innerWidth < 768 });
        }
      });

      document.addEventListener("DOMContentLoaded", function() {
        // Copyright year
        const yearEl = document.getElementById('copyright-year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        // Form Submission check with Expiry
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('reset') === 'true') {
          localStorage.removeItem("police_app_submitted");
          const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
          window.history.replaceState({path: cleanUrl}, '', cleanUrl);
        }

        function setSubmittedWithExpiry(hours) {
            const expiry = Date.now() + (hours * 60 * 60 * 1000);
            localStorage.setItem("police_app_submitted", 
              JSON.stringify({ submitted: true, expiry }));
        }

        function checkSubmitted() {
            const data = localStorage.getItem("police_app_submitted");
            if (!data) return false;
            
            try {
                const parsed = JSON.parse(data);
                if (typeof parsed === 'boolean' || typeof parsed === 'string') {
                    return true;
                }
                if (Date.now() > parsed.expiry) {
                    localStorage.removeItem("police_app_submitted");
                    return false;
                }
                return true;
            } catch (e) {
                return true;
            }
        }

        const hasSubmitted = checkSubmitted();
        if (hasSubmitted) {
          const form = document.querySelector(".police-form");
          if (form) {
            const alreadySubmittedMsg = document.createElement('div');
            alreadySubmittedMsg.className = 'already-submitted-msg';
            alreadySubmittedMsg.innerHTML = `
                Έχεις ήδη υποβάλει μια αίτηση!
                <span>Παρακαλώ περίμενε να εξεταστεί από το Staff.</span>
            `;
            form.replaceWith(alreadySubmittedMsg);
          }
        }

        const actualForm = document.querySelector(".police-form");
        if(actualForm && !hasSubmitted) {
            actualForm.addEventListener("submit", function() {
              setSubmittedWithExpiry(168); // 7 μέρες λήξη
            });
        }

        // Mobile Menu Setup
        const mobileMenuIcon = document.querySelector('.icon');
        if (mobileMenuIcon) {
          mobileMenuIcon.addEventListener('click', toggleMobileMenu);
        }

        // Cursor Logic
        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
          const cursor = document.getElementById('cursor');
          const glow = document.getElementById('cursorGlow');
          document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
          });
        }
      });

      function toggleMobileMenu() {
        const menu = document.getElementById("mobile_navbar_links");
        const btn = document.querySelector('.icon');
        const iconSvg = document.getElementById("menuIcon");
        const isOpen = menu.style.display === "flex";
        
        menu.style.display = isOpen ? "none" : "flex";
        btn.setAttribute('aria-expanded', !isOpen);
        
        iconSvg.innerHTML = isOpen
          ? '<path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>'
          : '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';
      }
    </script>
