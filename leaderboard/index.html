<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    
    <title>PGG Legacy - Leaderboard</title>
    
    <link rel="icon" type="image/png" href="/media/favicon.png">
    
    <!-- Libraries CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.bunny.net/css?family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Global CSS -->
    <link rel="stylesheet" href="/style.css">

    <style>
        /* Leaderboard UI Overrides aligned with style.css */
        .leaderboard-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .leaderboard-logo-container {
            text-align: center;
            margin-bottom: 10px;
        }

        .leaderboard-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.15rem;
            margin-top: 10px;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .leaderboard-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        .tab-btn {
            background: var(--background1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            padding: 10px 28px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border-radius: var(--roundness);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--accent1);
            border-color: var(--accent1);
            color: #fff;
            box-shadow: 0 0 20px rgba(107, 45, 216, 0.4);
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .list-item {
            display: flex;
            align-items: center;
            background: var(--background1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--roundness);
            padding: 16px 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .list-item:hover {
            transform: translateX(6px);
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Top 1: Deep Diamond Color */
        .list-item.rank-1 {
            border-color: rgba(0, 180, 216, 0.7);
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.2);
            background: linear-gradient(90deg, rgba(0, 180, 216, 0.08) 0%, var(--background1) 100%);
        }

        /* Top 2: Gold Color */
        .list-item.rank-2 {
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.06) 0%, var(--background1) 100%);
        }

        /* Top 3: Silver Color */
        .list-item.rank-3 {
            border-color: rgba(192, 192, 192, 0.5);
            box-shadow: 0 0 15px rgba(192, 192, 192, 0.1);
            background: linear-gradient(90deg, rgba(192, 192, 192, 0.06) 0%, var(--background1) 100%);
        }

        .item-rank {
            font-size: 1.6rem;
            font-weight: 800;
            width: 60px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .item-head {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            margin-right: 20px;
            image-rendering: pixelated;
            object-fit: cover;
            background-color: var(--background2);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .item-username {
            flex-grow: 1;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .item-time {
            font-size: 1.05rem;
            color: var(--accent1);
            font-weight: 800;
            text-align: right;
            background: var(--accent2_transp);
            padding: 8px 16px;
            border-radius: var(--roundness);
            border: 1px solid var(--accent1);
        }

        @media only screen and (max-width: 768px) {
            .list-item {
                padding: 12px 16px;
            }
            .item-rank {
                font-size: 1.3rem;
                width: 45px;
            }
            .item-head {
                width: 38px;
                height: 38px;
                margin-right: 12px;
            }
            .item-username {
                font-size: 1rem;
            }
            .item-time {
                font-size: 0.9rem;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ANIMATIONS ΠΟΝΤΙΚΙΟΥ -->
    <div class="custom-cursor" id="cursor"></div>
    <div class="cursor-glow" id="cursorGlow"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- NAVBAR (Desktop) -->
    <nav class="desktop_navbar">
      <a href="/"><img class="desktop_navbar_logo_img" src="/media/logo_small.svg" alt="PGG"></a>
      <a href="/#rules" class="desktop_navbar_link">Rules</a>
      <a href="/#discord" class="desktop_navbar_link">Community</a>
      <a href="/#about" class="desktop_navbar_link">About Us</a>
      <a href="/map" class="desktop_navbar_link">Server Map</a>
      <a href="/leaderboard" class="desktop_navbar_link" style="color: var(--accent1); font-weight: bold;">Leaderboard</a>
      <a href="/police" class="desktop_navbar_link" style="color: #ffcc00;">Police Applications</a>
      <div class="desktop_navbar_link2_div">
          <a href="/#join" class="desktop_navbar_link2">Join Us!</a>
      </div>
    </nav>

    <!-- NAVBAR (Mobile) -->
    <div class="mobile_navbar">
      <a href="/" class="mobile_navbar_logo_img_a">
        <img class="mobile_navbar_logo_img" src="/media/logo_small.svg" alt="PGG">
      </a>
      <div class="icon" onclick="toggleMobileMenu()">
          <i class="fa fa-bars" id="menuIcon"></i>
      </div>
      <div id="mobile_navbar_links">
          <a class="mobile_navbar_link" onclick="toggleMobileMenu()" href="/#rules">Rules</a>
          <a class="mobile_navbar_link" onclick="toggleMobileMenu()" href="/#discord">Community</a>
          <a class="mobile_navbar_link" onclick="toggleMobileMenu()" href="/#about">About Us</a>
          <a class="mobile_navbar_link" href="/map">Server Map</a>
          <a class="mobile_navbar_link" href="/leaderboard" style="color: var(--accent1); font-weight: bold;">Leaderboard</a>
          <a class="mobile_navbar_link" href="/police" style="color: #ffcc00;">Police Apps</a>
          <a class="mobile_navbar_link" onclick="toggleMobileMenu()" href="/#join">Join Us</a>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="mainflex" style="margin-top: 120px;">
      <div class="main2" style="min-height: 80vh; justify-content: center;">
        <div class="leaderboard-container">
            <div class="leaderboard-logo-container" data-aos="zoom-in">
                <img src="/media/logo.svg" alt="PGG Legacy Logo" class="main1_logo">
            </div>
            <h2 class="headline" data-aos="fade-up">TOP PLAYERS</h2>
            <p class="leaderboard-subtitle" data-aos="fade-up" data-aos-delay="100">
                Οι παίκτες με τις περισσότερες ώρες στον PGG Legacy Server
            </p>

            <div class="leaderboard-tabs" data-aos="fade-up" data-aos-delay="150">
                <button class="tab-btn active" id="btn-weekly" onclick="switchPeriod('weekly')">Weekly</button>
                <button class="tab-btn" id="btn-all" onclick="switchPeriod('all')">All-Time</button>
            </div>

            <div class="leaderboard-list" id="leaderboard-list" data-aos="fade-up" data-aos-delay="200">
                <!-- Dynamic Rows Loaded Here -->
            </div>
        </div>
      </div>
    </div>

    <footer class="copyright_div" style="margin-top: 0;">
      <a href="#" class="copyright">© 2026 PGG Legacy - All rights reserved.</a>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({ duration: 800, once: true, disable: window.innerWidth < 768 });

      function toggleMobileMenu() {
        const menu = document.getElementById("mobile_navbar_links");
        const icon = document.getElementById("menuIcon");
        if (menu.style.display === "flex") {
            menu.style.display = "none";
            icon.className = "fa fa-bars";
        } else {
            menu.style.display = "flex";
            icon.className = "fa fa-times";
        }
      }

      function switchPeriod(period) {
          document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
          if (period === 'all') {
              document.getElementById('btn-all').classList.add('active');
          } else {
              document.getElementById('btn-weekly').classList.add('active');
          }
          fetchLeaderboard(period);
      }

      async function fetchLeaderboard(period = 'weekly') {
          const listContainer = document.getElementById('leaderboard-list');
          listContainer.innerHTML = '<p style="text-align:center; color:rgba(255,255,255,0.6); padding: 40px; font-family: \'Space Grotesk\', sans-serif;">Φόρτωση δεδομένων...</p>';
          
          try {
              const endpoint = period === 'weekly' 
                  ? 'https://pgg-leaderboard-api.onrender.com?period=weekly' 
                  : 'https://pgg-leaderboard-api.onrender.com?period=all';

              const response = await fetch(endpoint); 
              const players = await response.json();

              listContainer.innerHTML = ''; 

              if (!players || players.length === 0 || players.error) {
                  const message = period === 'weekly' 
                      ? 'Δεν υπάρχουν διαθέσιμα δεδομένα για αυτήν την εβδομάδα.' 
                      : 'Δεν βρέθηκαν δεδομένα ακόμα.';
                  listContainer.innerHTML = `<p style="text-align:center; color:rgba(255,255,255,0.6); padding: 40px; font-family: \'Space Grotesk\', sans-serif;">${message}</p>`;
                  return;
              }

              players.slice(0, 25).forEach((player, index) => {
                  const rank = index + 1;
                  let rankColor = '#b0b8d0';
                  let rankClass = '';

                  if (rank === 1) { 
                      rankColor = '#00b4d8'; // Deeper Diamond color
                      rankClass = 'rank-1'; 
                  }
                  else if (rank === 2) { 
                      rankColor = '#ffd700'; // Gold color
                      rankClass = 'rank-2'; 
                  }
                  else if (rank === 3) { 
                      rankColor = '#c0c0c0'; // Silver color
                      rankClass = 'rank-3'; 
                  }

                  const itemHTML = `
                      <div class="list-item ${rankClass}">
                          <div class="item-rank" style="color: ${rankColor};">#${rank}</div>
                          <img class="item-head" src="${player.headUrl}" alt="${player.username}'s Head" onerror="this.src='https://mc-heads.net/avatar/steve/44';">
                          <div class="item-username">${player.username}</div>
                          <div class="item-time">${player.playtime}</div>
                      </div>
                  `;
                  
                  listContainer.insertAdjacentHTML('beforeend', itemHTML);
              });
          } catch (error) {
              console.error('Error loading leaderboard:', error);
              listContainer.innerHTML = '<p style="text-align:center; color:#ff5555; padding: 40px; font-family: \'Space Grotesk\', sans-serif;">Δεν ήταν δυνατή η σύνδεση με τη βάση δεδομένων.</p>';
          }
      }

      fetchLeaderboard('weekly');

      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        const cursor = document.getElementById('cursor');
        const glow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', (e) => {
          cursor.style.left = e.clientX + 'px';
          cursor.style.top = e.clientY + 'px';
          glow.style.left = e.clientX + 'px';
          glow.style.top = e.clientY + 'px';
        });
      }

      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && ['U','S','C'].includes(e.key.toUpperCase()))) {
          e.preventDefault();
        }
      });
      document.addEventListener('dragstart', e => e.preventDefault());
    </script>
</body>
</html>
