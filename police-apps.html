<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>PGG Legacy - Αιτήσεις Αστυνομίας</title>
    <link rel="icon" type="image/png" href="media/favicon.png">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.bunny.net/css?family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="custom-cursor" id="cursor"></div>
    <div class="cursor-glow" id="cursorGlow"></div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <nav class="desktop_navbar">
      <a href="index.html"><img class="desktop_navbar_logo_img" src="media/logo_small.svg" alt="logo"></a>
      <a href="index.html#rules" class="desktop_navbar_link">Rules</a>
      <a href="index.html#discord" class="desktop_navbar_link">Community</a>
      <a href="index.html#about" class="desktop_navbar_link">About Us</a>
      <div class="desktop_navbar_link2_div">
          <a href="index.html#join" class="desktop_navbar_link2">Join Us!</a>
      </div>
    </nav>
    <div class="mobile_navbar">
      <a href="index.html" class="mobile_navbar_logo_img_a">
        <img class="mobile_navbar_logo_img" src="media/logo_small.svg" alt="logo">
      </a>
      <div class="icon" onclick="toggleMobileMenu()">
          <i class="fa fa-bars" id="menuIcon"></i>
      </div>
      <div id="mobile_navbar_links">
          <a class="mobile_navbar_link" href="index.html#rules">Rules</a>
          <a class="mobile_navbar_link" href="index.html#discord">Community</a>
          <a class="mobile_navbar_link" href="index.html#about">About Us</a>
          <a class="mobile_navbar_link" href="index.html#join">Join Us</a>
      </div>
    </div>
    <div class="mainflex" style="margin-top: 120px;">
      <div class="main2">
        <h2 class="headline" data-aos="fade-up">Κατάταξη στην Αστυνομία</h2>
        <p class="main1_actcent" data-aos="fade-up" data-aos-delay="100" style="text-align:center; font-size:1.2rem; margin-bottom:40px;">
          Συμπληρώστε την παρακάτω φόρμα για να εξεταστεί η αίτησή σας από το Staff.
        </p>
        <div class="main2_features_div" style="justify-content: center;">
          <div class="main2_feature" data-aos="zoom-in" data-aos-delay="200" style="width: 100%; max-width: 600px; text-align: left; cursor: default;">
            <form action="https://api.web3forms.com/submit" method="POST" class="police-form">
              <input type="hidden" name="access_key" value="d8fdfcc5-2890-4965-8b66-8d859e92fd29">
              <input type="hidden" name="redirect" value="https://pgglegacy.gr/">
              <div class="form-group">
                <label for="discord_tag">Discord Username</label>
                <input type="text" id="discord_tag" name="Discord Tag" placeholder="π.χ. mpamiasdl" required>
              </div>
              <div class="form-group">
                <label for="ign">In-Game Name (Minecraft Name)</label>
                <input type="text" id="ign" name="In-Game Name" placeholder="π.χ. ThFos" required>
              </div>
              <div class="form-group">
                <label for="age">Ηλικία (OOC)</label>
                <input type="number" id="age" name="Age" min="12" max="99" placeholder="π.χ. 18" required>
              </div>
              <div class="form-group">
                <label for="hours">Πόσες ώρες μπορείς να διαθέσεις την εβδομάδα</label>
                <input type="text" id="hours" name="Available Hours" placeholder="π.χ. 10-15 ώρες" required>
              </div>
              <div class="form-group">
                <label for="experience">Έχεις προηγούμενη εμπειρία ως Αστυνομικός σε RP;</label>
                <textarea id="experience" name="Experience" rows="4" placeholder="Περίγραψε την εμπειρία σου σε άλλους servers που έχεις παίξει..." required></textarea>
              </div>
              <div class="form-group">
                <label for="reason">Γιατί θέλεις να μπεις στο σώμα της Αστυνομίας;</label>
                <textarea id="reason" name="Reason for Joining" rows="4" placeholder="Ανέλυσε τους λόγους για τους οποίους πρέπει να επιλέξουμε εσένα..." required></textarea>
              </div>
              <div style="text-align: center; margin-top: 25px;">
                <button type="submit" class="main3_join_title" style="background: var(--accent-color, #5865F2); color: white; border: none; padding: 12px 35px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-family: 'Space Grotesk', sans-serif; transition: 0.3s; box-shadow: 0 4px 15px rgba(88,101,242,0.3);">
                  Υποβολή Αίτησης
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <footer class="copyright_div" style="margin-top: 60px;">
      <a href="#" class="copyright">© 2026 PGG Legacy - All rights reserved.</a>
    </footer>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({ duration: 800, once: true });
      document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('reset') === 'true') {
          localStorage.removeItem("police_app_submitted");
          const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
          window.history.replaceState({path: cleanUrl}, '', cleanUrl);
        }
        const hasSubmitted = localStorage.getItem("police_app_submitted");
        if (hasSubmitted) {
          const form = document.querySelector(".police-form");
          form.innerHTML = `<div style="text-align:center; padding: 30px 20px; color: #ff4a4a; font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: bold; background: rgba(255,74,74,0.1); border: 1px solid rgba(255,74,74,0.3); border-radius: 8px;">
                              Έχεις ήδη υποβάλει μια αίτηση! <br><span style="font-size:1rem; font-weight:normal; color:#bbb;">Παρακαλώ περίμενε να εξεταστεί από το Staff.</span>
                            </div>`;
        }
      });
      document.querySelector(".police-form").addEventListener("submit", function(e) {
        localStorage.setItem("police_app_submitted", "true");
      });
      function toggleMobileMenu() {
        const menu = document.getElementById("mobile_navbar_links");
        const icon = document.getElementById("menuIcon");
        if (menu.style.display === "flex") {
            menu.style.display = "none";
            icon.className = "fa fa-bars";
        } else {
            menu.style.display = "flex";
            icon.className = "fa fa-times";
        }
      }
      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        const cursor = document.getElementById('cursor');
        const glow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', (e) => {
          cursor.style.left = e.clientX + 'px';
          cursor.style.top = e.clientY + 'px';
          glow.style.left = e.clientX + 'px';
          glow.style.top = e.clientY + 'px';
        });
      }
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
        }
        if (e.ctrlKey && e.shiftKey && (['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key) || [73, 74, 67].includes(e.keyCode))) {
          e.preventDefault();
        }
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
          e.preventDefault();
        }
        if (e.ctrlKey && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
          e.preventDefault();
        }
        if (e.ctrlKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) {
          e.preventDefault();
        }
      });
      document.addEventListener('dragstart', function(e) {
        e.preventDefault();
      });
    </script>
  </body>
</html>
