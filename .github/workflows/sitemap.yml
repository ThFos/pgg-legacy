name: Generate Custom Sitemap & Feed

on:
  workflow_dispatch: # Σου επιτρέπει να το τρέχεις χειροκίνητα από το GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'blog/**'
      - '**.html'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Sitemap Generator
        run: python scripts/generate_sitemap.py

      - name: Commit & Push sitemap.xml & feed.xml
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update sitemap.xml & feed.xml [skip ci]"
          file_pattern: "sitemap.xml feed.xml"

      - name: Send Discord Notification
        if: steps.auto_commit.outputs.changes_detected == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "📢 **Νέο άρθρο στο PGG Legacy Blog!**\nΔείτε όλες τις λεπτομέρειες εδώ: https://pgglegacy.gr/blog/"}' \
               $DISCORD_WEBHOOK
