name: Generate Custom Sitemap

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'
      - '**.html'

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Sitemap Generator
        run: python scripts/generate_sitemap.py

      - name: Commit & Push sitemap.xml
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update sitemap.xml [skip ci]"
          file_pattern: "sitemap.xml"
