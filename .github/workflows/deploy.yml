name: Deploy with Minification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Minify CSS, JS & HTML
        run: |
          npm install -g clean-css-cli terser html-minifier-terser
          find . -type f -name "*.css" -not -path "*/.*" -exec cleancss -o {} {} \;
          find . -type f -name "*.js" -not -path "*/.*" -exec terser {} --compress --mangle -o {} \;
          find . -type f -name "*.html" -not -path "*/.*" -exec html-minifier-terser --collapse-whitespace --remove-comments -o {} {} \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
